name: OpenSlot checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openslot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Frontend checks and build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build
      - name: NS8 UI build
        working-directory: packaging/ns8/ui
        run: |
          npm exec --yes --package=@yarnpkg/cli-dist@4.18.0 -- yarn install --immutable
          RAYON_NUM_THREADS=2 npm exec --yes --package=@yarnpkg/cli-dist@4.18.0 -- yarn build
          npm exec --yes --package=@yarnpkg/cli-dist@4.18.0 -- yarn exec playwright install --with-deps chromium
          npm exec --yes --package=@yarnpkg/cli-dist@4.18.0 -- yarn test
      - name: Go format and build
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal frontend/*.go)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go build ./...
